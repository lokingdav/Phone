syntax = "proto3";

package denseid.enrollment.v1;

option go_package = "github.com/dense-identity/denseid/api/go/enrollment/v1;enrollmentpb";

service EnrollmentService {
  rpc StartEnrollment(EnrollmentRequest) returns (StartEnrollmentResponse);
  rpc CompleteEnrollment(CompleteEnrollmentRequest) returns (EnrollmentResponse);
  rpc EnrollSubscriber(EnrollmentRequest) returns (EnrollmentResponse);
}

// EnrollmentRequest contains the serialized DIA enrollment request.
// All cryptographic details (keys, signatures, tickets, identity info)
// are encoded within dia_request by the DIA library.
message EnrollmentRequest {
  bytes dia_request = 1;  // Serialized DIA enrollment request
}

// EnrollmentResponse contains the serialized DIA enrollment response.
// All enrollment data (credentials, tickets, expiration, public keys)
// are encoded within dia_response by the DIA library.
message EnrollmentResponse {
  bytes dia_response = 1;  // Serialized DIA enrollment response
}

// StartEnrollmentResponse returns the OTP code when SMS sending is disabled.
message StartEnrollmentResponse {
  string otp_code = 1;
}

// CompleteEnrollmentRequest contains only the OTP challenge.
// c = H(request_payload || code), hex-encoded.
message CompleteEnrollmentRequest {
  string c = 1;
}